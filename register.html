<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register • LuxTube</title>

<link rel="icon" href="assets/logo.png">

<link rel="stylesheet" href="css/register.css">

</head>

<body>

<div class="register-container">

<div class="register-card">

<img src="assets/logo.png" class="logo" alt="LuxTube">

<h1>Create your account</h1>

<p class="subtitle">
Join LuxTube and upload your videos.
</p>

<form id="registerForm">

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<button
type="submit"
class="register-btn">

Create Account

</button>

</form>

<div class="divider">

<span>OR</span>

</div>

<button
type="button"
id="githubRegister"
class="github-btn">

<svg xmlns="http://www.w3.org/2000/svg"
width="22"
height="22"
fill="currentColor"
viewBox="0 0 16 16">

<path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38

0 0 .67-.21 2.2.82a7.5 7.5 0 0 1 4 0c1.53-1.04
2.2-.82 2.2-.82.44 1.1.16 1.92.08
2.12.51.56.82 1.27.82
2.15 0 3.07-1.87 3.75-3.65
3.95.29.25.54.73.54
1.48 0 1.07-.01 1.93-.01
2.2 0 .21.15.46.55.38A8 8 0 0 0
16 8c0-4.42-3.58-8-8-8z"/>

</svg>

Continue with GitHub

</button>

<p class="login-text">

Already have an account?

<a href="login.html">

Sign In

</a>

</p>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/register.js"></script>

</body>

</html>
