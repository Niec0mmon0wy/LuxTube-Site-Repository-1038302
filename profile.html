<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile • LuxTube</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
    margin:0;
    background:#0b1220;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.banner{
    height:260px;
    background:linear-gradient(135deg,#2563eb,#38bdf8);
}

.profile{

    max-width:1200px;

    margin:auto;

    padding:0 30px;

}

.avatar{

    width:150px;

    height:150px;

    border-radius:50%;

    background:#1f2937;

    border:6px solid #0b1220;

    margin-top:-75px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:70px;

}

.user{

    margin-top:20px;

}

.user h1{

    margin-bottom:8px;

}

.user p{

    color:#94a3b8;

}

.buttons{

    margin-top:25px;

    display:flex;

    gap:15px;

    flex-wrap:wrap;

}

.btn{

    padding:14px 25px;

    background:#2563eb;

    color:white;

    border-radius:12px;

    text-decoration:none;

}

.btn.secondary{

    background:#1f2937;

}

.section{

    margin-top:50px;

}

.section h2{

    margin-bottom:20px;

}

.empty{

    background:#111827;

    border:2px dashed #374151;

    border-radius:18px;

    padding:60px;

    text-align:center;

}

.empty h3{

    margin-bottom:12px;

}

.empty p{

    color:#94a3b8;

}

footer{

    margin-top:60px;

    text-align:center;

    padding:30px;

    color:#94a3b8;

}

</style>

</head>

<body>

<div class="banner"></div>

<div class="profile">

<div class="avatar">

👤

</div>

<div class="user">

<h1 id="username">

Your Username

</h1>

<p id="email">

Not signed in

</p>

</div>

<div class="buttons">

<a href="upload.html" class="btn">

Upload Video

</a>

<a href="settings.html" class="btn secondary">

Settings

</a>

<a href="index.html" class="btn secondary">

Home

</a>

</div>

<div class="section">

<h2>Your Videos</h2>

<div class="empty">

<h3>No videos uploaded</h3>

<p>

Upload your first video to start your LuxTube channel.

</p>

</div>

</div>

<div class="section">

<h2>Your Playlists</h2>

<div class="empty">

<h3>No playlists created</h3>

<p>

Create playlists after uploading videos.

</p>

</div>

</div>

<div class="section">

<h2>About</h2>

<div class="empty">

<h3>No bio yet</h3>

<p>

Add a biography from Settings.

</p>

</div>

</div>

</div>

<footer>

© 2026 LuxTube

</footer>

<script>

/*
Later you'll replace this with Supabase.

Example:

username.textContent=user.user_metadata.username;
email.textContent=user.email;

*/

</script>

</body>
</html>
