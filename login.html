<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LuxTube - Login</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
    background:#0b1220;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.card{
    width:430px;
    background:#111827;
    border:1px solid #1f2937;
    border-radius:24px;
    padding:40px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:25px;
}

.logo img{
    width:80px;
    margin-bottom:12px;
}

.logo h1{
    color:#5ac8ff;
    margin:0;
}

.logo p{
    color:#94a3b8;
}

.input{
    margin-bottom:18px;
}

.input label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.input input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#1f2937;
    color:white;
    font-size:16px;
    outline:none;
}

.password-box{
    position:relative;
}

.password-box button{
    position:absolute;
    right:10px;
    top:8px;
    border:none;
    background:none;
    color:#5ac8ff;
    cursor:pointer;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:18px 0;
    font-size:14px;
}

.options a{
    color:#5ac8ff;
    text-decoration:none;
}

.login-btn{
    width:100%;
    padding:15px;
    background:#3b82f6;
    color:white;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-size:17px;
    font-weight:bold;
}

.login-btn:hover{
    background:#2563eb;
}

.divider{
    text-align:center;
    color:#94a3b8;
    margin:25px 0;
}

.social{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    margin-bottom:12px;
    cursor:pointer;
    background:#1f2937;
    color:white;
}

.bottom{
    text-align:center;
    margin-top:25px;
}

.bottom a{
    color:#5ac8ff;
    text-decoration:none;
}

.home{
    text-align:center;
    margin-top:20px;
}

.home a{
    color:#94a3b8;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

<div class="logo">

<img src="assets/logo.png" alt="LuxTube">

<h1>LuxTube</h1>

<p>Welcome Back</p>

</div>

<form id="loginForm">

<div class="input">

<label>Email</label>

<input
type="email"
id="email"
name="email"
autocomplete="username"
placeholder="Enter your email"
required>

</div>

<div class="input">

<label>Password</label>

<div class="password-box">

<input
type="password"
id="password"
name="password"
autocomplete="current-password"
placeholder="Enter your password"
required>

<button type="button" id="togglePassword">Show</button>

</div>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember me

</label>

<a href="forgot-password.html">

Forgot Password?

</a>

</div>

<button class="login-btn" type="submit">

Login

</button>

</form>

<div class="divider">

or

</div>

<button class="social">

Continue with GitHub

</button>

<button class="social">

Continue with Discord

</button>

<div class="bottom">

Don't have an account?

<a href="register.html">

Create Account

</a>

</div>

<div class="home">

<a href="index.html">

← Back to Home

</a>

</div>

</div>

<script>

const password=document.getElementById("password");
const toggle=document.getElementById("togglePassword");

toggle.onclick=()=>{

if(password.type==="password"){

password.type="text";
toggle.textContent="Hide";

}else{

password.type="password";
toggle.textContent="Show";

}

};

document.getElementById("loginForm").addEventListener("submit",(e)=>{

e.preventDefault();

/*
Connect Supabase login here later.
*/

console.log("Login clicked.");

});

</script>

</body>
</html>
